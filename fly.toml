# fly.toml app configuration file generated for teaching-learning-platform on 2026-08-26T00:53:39+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

# The project is called Teach Me; these three names are not renamed with it. The app name is the
# deployed hostname, the connection string points at a file on a live volume, and the seed email
# identifies the administrator row that already exists in that file. Changing any of them creates
# a new thing rather than renaming the old one.
app = 'teaching-learning-platform'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  ConnectionStrings__AppDb = 'Data Source=/app/data/teacherslessons.db'
  Cors__AllowedOrigin = 'https://REPLACE-WITH-YOUR-VERCEL-URL.vercel.app'
  Seed__AdminEmail = 'admin@teacherslessons.test'

[[mounts]]
  source = 'sqlite_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 100

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
