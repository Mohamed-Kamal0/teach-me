app = "teaching-learning-platform" # You can change this to a unique name
primary_region = "ams" # Change to your preferred region (e.g., 'iad', 'lhr')

[build]
  dockerfile = "server/Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  Cors__AllowedOrigin = "https://teaching-learning-platform-git-main-mohamed-kamal0s-projects.vercel.app"
  ConnectionStrings__AppDb = "Data Source=/app/data/teacherslessons.db"
  Seed__AdminEmail = "admin@example.com"

[mounts]
  source = "sqlite_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
