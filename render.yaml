services:
  - type: web
    name: teaching-learning-api
    env: docker
    dockerContext: server
    dockerfilePath: server/Dockerfile
    disk:
      name: sqlite-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Cors__AllowedOrigin
        value: https://YOUR_VERCEL_FRONTEND_URL.vercel.app
      - key: ConnectionStrings__AppDb
        value: "Data Source=/app/data/teacherslessons.db"
      - key: Seed__AdminEmail
        value: admin@example.com
      - key: Seed__AdminPassword
        generateValue: true
